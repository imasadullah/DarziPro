<div class="mf">
  <label class="mf__label" [for]="inputId">{{ label }}</label>
  <div class="mf__input-wrap">
    <input
      class="mf__input"
      type="number"
      min="0"
      step="0.5"
      [id]="inputId"
      [value]="value ?? ''"
      [disabled]="disabled"
      [readOnly]="readonly"
      (input)="onInput($event)"
      autocomplete="off"
    />
    <span class="mf__unit" aria-hidden="true">{{ unit }}</span>
  </div>
</div>
